<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>伦敦天气</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: #0f1923;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 680px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(10px);
    margin-bottom: 20px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .city-name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .city-sub {
    font-size: 13px;
    color: #7a8fa6;
    margin-top: 3px;
  }

  .refresh-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #aac;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .refresh-btn:disabled { opacity: 0.4; cursor: default; }

  .now-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .weather-icon {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 0 16px rgba(255,255,255,0.2));
  }

  .temp-main {
    font-size: 72px;
    font-weight: 200;
    line-height: 1;
  }

  .temp-unit {
    font-size: 28px;
    color: #7a8fa6;
    vertical-align: super;
  }

  .weather-desc {
    font-size: 18px;
    color: #c0d0e0;
    margin-top: 6px;
  }

  .feels-like {
    font-size: 13px;
    color: #7a8fa6;
    margin-top: 4px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }

  .stat-icon { font-size: 22px; margin-bottom: 6px; }
  .stat-label { font-size: 11px; color: #6a7f96; text-transform: uppercase; letter-spacing: 0.8px; }
  .stat-value { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .stat-unit { font-size: 12px; color: #7a8fa6; }

  .section-title {
    font-size: 12px;
    color: #6a7f96;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  /* 24小时预报 */
  .hourly-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.2) transparent;
  }

  .hourly-item {
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: center;
    min-width: 68px;
    transition: background 0.2s;
  }

  .hourly-item.now-highlight {
    background: rgba(100,160,255,0.15);
    border-color: rgba(100,160,255,0.4);
  }

  .hourly-time { font-size: 11px; color: #7a8fa6; margin-bottom: 6px; }
  .hourly-icon { font-size: 20px; margin-bottom: 6px; }
  .hourly-temp { font-size: 15px; font-weight: 600; }
  .hourly-rain { font-size: 10px; color: #6ab0ff; margin-top: 3px; }

  /* 7天预报 */
  .daily-list { display: flex; flex-direction: column; gap: 8px; }

  .daily-item {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 12px 18px;
    gap: 12px;
  }

  .daily-day { width: 60px; font-size: 14px; color: #c0d0e0; }
  .daily-icon { font-size: 22px; flex-shrink: 0; }
  .daily-desc { flex: 1; font-size: 13px; color: #8a9fb6; }
  .daily-rain { font-size: 12px; color: #6ab0ff; min-width: 36px; text-align: right; }
  .daily-temps { display: flex; gap: 8px; font-size: 14px; }
  .daily-high { font-weight: 600; }
  .daily-low { color: #7a8fa6; }

  /* 温度条 */
  .temp-bar-wrap { flex: 1; display: flex; align-items: center; gap: 6px; }
  .temp-bar-bg {
    flex: 1; height: 4px; background: rgba(255,255,255,0.1);
    border-radius: 2px; overflow: hidden;
  }
  .temp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4a9eff, #ff7043);
    border-radius: 2px;
  }

  .update-time {
    text-align: center;
    font-size: 11px;
    color: #4a5f70;
    margin-top: 8px;
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 60px;
    color: #7a8fa6;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #4a9eff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    text-align: center;
    padding: 40px;
    color: #e07070;
    font-size: 14px;
    line-height: 1.8;
  }

  /* UV指数颜色 */
  .uv-low { color: #4caf50; }
  .uv-mod { color: #ffeb3b; }
  .uv-high { color: #ff9800; }
  .uv-vhigh { color: #f44336; }
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <div class="loading">
      <div class="spinner"></div>
      <span>正在获取伦敦天气...</span>
    </div>
  </div>
</div>

<script>
// Open-Meteo API (完全免费，无需 key)
const LAT = 51.5074;
const LON = -0.1278;

const WMO_CODES = {
  0:  { desc: '晴朗',       icon: '☀️' },
  1:  { desc: '大部晴朗',   icon: '🌤️' },
  2:  { desc: '局部多云',   icon: '⛅' },
  3:  { desc: '阴天',       icon: '☁️' },
  45: { desc: '有雾',       icon: '🌫️' },
  48: { desc: '冻雾',       icon: '🌫️' },
  51: { desc: '毛毛雨(轻)', icon: '🌦️' },
  53: { desc: '毛毛雨',     icon: '🌦️' },
  55: { desc: '毛毛雨(重)', icon: '🌧️' },
  61: { desc: '小雨',       icon: '🌧️' },
  63: { desc: '中雨',       icon: '🌧️' },
  65: { desc: '大雨',       icon: '🌧️' },
  71: { desc: '小雪',       icon: '🌨️' },
  73: { desc: '中雪',       icon: '❄️' },
  75: { desc: '大雪',       icon: '❄️' },
  77: { desc: '雪粒',       icon: '🌨️' },
  80: { desc: '阵雨(轻)',   icon: '🌦️' },
  81: { desc: '阵雨',       icon: '🌧️' },
  82: { desc: '阵雨(强)',   icon: '⛈️' },
  85: { desc: '阵雪',       icon: '🌨️' },
  86: { desc: '强阵雪',     icon: '❄️' },
  95: { desc: '雷雨',       icon: '⛈️' },
  96: { desc: '雷雨冰雹',   icon: '⛈️' },
  99: { desc: '强雷雨冰雹', icon: '⛈️' },
};

function getWMO(code) {
  return WMO_CODES[code] || { desc: '未知', icon: '🌡️' };
}

function windDir(deg) {
  const dirs = ['北','东北','东','东南','南','西南','西','西北'];
  return dirs[Math.round(deg / 45) % 8];
}

function uvClass(uv) {
  if (uv <= 2) return 'uv-low';
  if (uv <= 5) return 'uv-mod';
  if (uv <= 7) return 'uv-high';
  return 'uv-vhigh';
}

function uvLabel(uv) {
  if (uv <= 2) return '低';
  if (uv <= 5) return '中';
  if (uv <= 7) return '高';
  if (uv <= 10) return '很高';
  return '极高';
}

function dayName(dateStr, i) {
  if (i === 0) return '今天';
  if (i === 1) return '明天';
  const d = new Date(dateStr);
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return days[d.getDay()];
}

async function fetchWeather() {
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${LAT}&longitude=${LON}`
    + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,uv_index,surface_pressure,visibility'
    + '&hourly=temperature_2m,weather_code,precipitation_probability'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max'
    + '&wind_speed_unit=kmh&timezone=Europe%2FLondon&forecast_days=7';

  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function render(data) {
  const c = data.current;
  const h = data.hourly;
  const d = data.daily;

  const wmo = getWMO(c.weather_code);
  const now = new Date();
  const nowHour = now.getHours();

  // 找当前小时在hourly中的索引
  const currentIdx = h.time.findIndex(t => {
    const hh = new Date(t).getHours();
    const dd = new Date(t).toDateString();
    return dd === now.toDateString() && hh === nowHour;
  });

  // 取接下来24小时
  const startIdx = currentIdx >= 0 ? currentIdx : 0;
  const hourlySlice = h.time.slice(startIdx, startIdx + 24).map((t, i) => {
    const idx = startIdx + i;
    return {
      time: t,
      temp: Math.round(h.temperature_2m[idx]),
      code: h.weather_code[idx],
      rain: h.precipitation_probability[idx],
    };
  });

  // 最低/最高温(用于温度条)
  const allMax = Math.max(...d.temperature_2m_max);
  const allMin = Math.min(...d.temperature_2m_min);

  const updateStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  const visKm = c.visibility ? (c.visibility / 1000).toFixed(1) : '--';
  const uvVal = Math.round(c.uv_index ?? 0);

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="header">
        <div>
          <div class="city-name">🇬🇧 伦敦</div>
          <div class="city-sub">London, United Kingdom · ${now.toLocaleDateString('zh-CN', {month:'long',day:'numeric',weekday:'long'})}</div>
        </div>
        <button class="refresh-btn" onclick="load()">↻ 刷新</button>
      </div>

      <div class="now-row">
        <div class="weather-icon">${wmo.icon}</div>
        <div>
          <div>
            <span class="temp-main">${Math.round(c.temperature_2m)}</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="weather-desc">${wmo.desc}</div>
          <div class="feels-like">体感温度 ${Math.round(c.apparent_temperature)}°C</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-icon">💧</div>
          <div class="stat-label">湿度</div>
          <div class="stat-value">${c.relative_humidity_2m}<span class="stat-unit">%</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">🌬️</div>
          <div class="stat-label">风速</div>
          <div class="stat-value">${Math.round(c.wind_speed_10m)}<span class="stat-unit"> km/h</span></div>
          <div class="stat-unit" style="margin-top:2px">${windDir(c.wind_direction_10m)}风</div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">🌡️</div>
          <div class="stat-label">气压</div>
          <div class="stat-value">${Math.round(c.surface_pressure)}<span class="stat-unit"> hPa</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">☔</div>
          <div class="stat-label">降水</div>
          <div class="stat-value">${c.precipitation.toFixed(1)}<span class="stat-unit"> mm</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">🔆</div>
          <div class="stat-label">紫外线</div>
          <div class="stat-value ${uvClass(uvVal)}">${uvVal} <span class="stat-unit">${uvLabel(uvVal)}</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">👁️</div>
          <div class="stat-label">能见度</div>
          <div class="stat-value">${visKm}<span class="stat-unit"> km</span></div>
        </div>
      </div>

      <div class="section-title">未来24小时</div>
      <div class="hourly-scroll">
        ${hourlySlice.map((item, i) => {
          const t = new Date(item.time);
          const label = i === 0 ? '现在' : `${t.getHours().toString().padStart(2,'0')}:00`;
          const hw = getWMO(item.code);
          return `<div class="hourly-item ${i === 0 ? 'now-highlight' : ''}">
            <div class="hourly-time">${label}</div>
            <div class="hourly-icon">${hw.icon}</div>
            <div class="hourly-temp">${item.temp}°</div>
            <div class="hourly-rain">${item.rain}%</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="section-title">7天预报</div>
      <div class="daily-list">
        ${d.time.map((date, i) => {
          const dw = getWMO(d.weather_code[i]);
          const hi = Math.round(d.temperature_2m_max[i]);
          const lo = Math.round(d.temperature_2m_min[i]);
          const rain = d.precipitation_probability_max[i];
          const barW = allMax > allMin
            ? Math.round(((hi - allMin) / (allMax - allMin)) * 100)
            : 50;
          const sunrise = new Date(d.sunrise[i]).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
          const sunset  = new Date(d.sunset[i]).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
          return `<div class="daily-item">
            <div class="daily-day">${dayName(date, i)}</div>
            <div class="daily-icon">${dw.icon}</div>
            <div class="daily-desc">${dw.desc}<br><span style="font-size:11px;color:#4a5f70">🌅${sunrise} 🌇${sunset}</span></div>
            <div class="daily-rain">${rain}%</div>
            <div class="daily-temps">
              <span class="daily-low">${lo}°</span>
              <div class="temp-bar-bg" style="width:60px;display:inline-flex;align-items:center">
                <div class="temp-bar-fill" style="width:${barW}%"></div>
              </div>
              <span class="daily-high">${hi}°</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="update-time">数据来源: Open-Meteo · 更新于 ${updateStr}</div>
  `;
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="error-msg">
        ⚠️ 获取天气数据失败<br>
        <small style="color:#5a7080">${msg}</small><br><br>
        <button class="refresh-btn" onclick="load()" style="margin:auto;display:block">重试</button>
      </div>
    </div>`;
}

async function load() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="loading"><div class="spinner"></div><span>正在获取伦敦天气...</span></div>
    </div>`;
  try {
    const data = await fetchWeather();
    render(data);
  } catch (e) {
    renderError(e.message);
  }
}

load();
</script>
</body>
</html>
