<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>20以内加减法练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container { width: 100%; max-width: 500px; }

  .title {
    text-align: center;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  }

  /* 顶部信息栏 */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .badges { display: flex; gap: 8px; }

  .badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #f3faf6;
    border: 1.5px solid #d0f0e0;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 700;
  }

  .badge.green { color: #11998e; border-color: #b0e8d8; background: #edfaf6; }
  .badge.red   { color: #e55; border-color: #ffd0d0; background: #fff0f0; }

  .qnum {
    font-size: 13px;
    color: #aaa;
    font-weight: 600;
  }

  /* 进度条 */
  .progress-wrap {
    background: #eef8f4;
    border-radius: 6px;
    height: 8px;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    border-radius: 6px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  /* 题目 */
  .question-wrap { text-align: center; margin-bottom: 28px; }

  .question {
    font-size: 58px;
    font-weight: 800;
    color: #1a2a1a;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 10px;
  }

  .question .op { color: #11998e; }
  .question .eq { color: #bbb; }

  .answer-display {
    display: inline-block;
    min-width: 70px;
    border-bottom: 5px solid #11998e;
    color: #1a2a1a;
    transition: color 0.2s, border-color 0.2s;
    vertical-align: bottom;
    padding-bottom: 2px;
  }

  .answer-display.correct { color: #11998e; border-color: #11998e; }
  .answer-display.wrong   { color: #e55; border-color: #e55; }

  .hint {
    font-size: 14px;
    min-height: 22px;
    font-weight: 600;
    transition: color 0.2s;
  }

  /* 数字键盘 */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin-bottom: 16px;
  }

  .key {
    aspect-ratio: 1;
    border: none;
    border-radius: 14px;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    background: #edfaf6;
    color: #0d7a6a;
    box-shadow: 0 4px 0 #b0ddd4;
    transition: transform 0.08s, box-shadow 0.08s, background 0.12s;
    font-family: inherit;
  }

  .key:hover  { background: #d8f5ed; }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #b0ddd4; }

  .key.del {
    background: #fff0f0;
    color: #e55;
    box-shadow: 0 4px 0 #ffc8c8;
    font-size: 18px;
  }
  .key.del:hover  { background: #ffe0e0; }
  .key.del:active { transform: translateY(3px); box-shadow: 0 1px 0 #ffc8c8; }

  .key.zero {
    grid-column: span 2;
    aspect-ratio: auto;
    padding: 15px;
  }

  /* 提交按钮 */
  .submit-btn {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 6px 0 #0d7a6a;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.15s;
    font-family: inherit;
  }

  .submit-btn:hover   { opacity: 0.92; }
  .submit-btn:active  { transform: translateY(4px); box-shadow: 0 2px 0 #0d7a6a; }
  .submit-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  /* 反馈浮层 */
  .feedback {
    position: fixed;
    top: 50%; left: 50%;
    font-size: 90px;
    pointer-events: none;
    opacity: 0;
    z-index: 99;
  }

  .feedback.show { animation: popFade 0.65s ease forwards; }

  @keyframes popFade {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%,-60%) scale(1.2); }
    70%  { opacity: 1; transform: translate(-50%,-65%) scale(1.0); }
    100% { opacity: 0; transform: translate(-50%,-80%) scale(0.9); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-10px); }
    40%     { transform: translateX(10px); }
    60%     { transform: translateX(-8px); }
    80%     { transform: translateX(8px); }
  }

  .question.shake { animation: shake 0.38s ease; }

  /* 结算 */
  .result-screen { display: none; text-align: center; padding: 10px 0; }
  .result-screen.visible { display: block; }

  .result-emoji { font-size: 80px; margin-bottom: 14px; }
  .result-title { font-size: 26px; font-weight: 800; color: #1a2a1a; margin-bottom: 8px; }
  .result-sub   { font-size: 14px; color: #888; margin-bottom: 26px; line-height: 1.9; white-space: pre-line; }

  .result-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .rs {
    background: #edfaf6;
    border-radius: 16px;
    padding: 14px 18px;
    min-width: 88px;
  }

  .rs-num   { font-size: 30px; font-weight: 800; color: #11998e; }
  .rs-label { font-size: 12px; color: #aaa; margin-top: 3px; }

  .restart-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .restart-btn:hover { opacity: 0.9; }

  /* 难度切换 */
  .mode-row {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }

  .mode-btn {
    flex: 1;
    padding: 9px 0;
    border: 2px solid #d0ede6;
    border-radius: 10px;
    background: #fff;
    color: #88aaa0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .mode-btn.active {
    background: #11998e;
    border-color: #11998e;
    color: #fff;
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">🌿 口算练习</div>
  <p class="subtitle">20以内加减法 · 共10题</p>

  <div class="card">
    <!-- 主界面 -->
    <div id="quizScreen">

      <!-- 难度 -->
      <div class="mode-row">
        <button class="mode-btn active" id="modeAdd"    onclick="setMode('add')">➕ 加法</button>
        <button class="mode-btn"        id="modeSub"    onclick="setMode('sub')">➖ 减法</button>
        <button class="mode-btn"        id="modeMix"    onclick="setMode('mix')">🔀 混合</button>
      </div>

      <!-- 信息栏 -->
      <div class="top-bar">
        <div class="badges">
          <div class="badge green">✓ <span id="correctCount">0</span></div>
          <div class="badge red">✗ <span id="wrongCount">0</span></div>
        </div>
        <div class="qnum">第 <span id="questionIndex">1</span> / 10 题</div>
      </div>

      <!-- 进度 -->
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <!-- 题目 -->
      <div class="question-wrap">
        <div class="question" id="question">
          <span id="num1">?</span>
          <span class="op" id="operator">+</span>
          <span id="num2">?</span>
          <span class="eq"> = </span>
          <span class="answer-display" id="answerDisplay">&nbsp;&nbsp;</span>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <!-- 键盘 -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key del" onclick="pressDelete()">⌫</button>
        <button class="key zero" onclick="pressKey('0')">0</button>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submit()" disabled>确认答案</button>
    </div>

    <!-- 结算界面 -->
    <div class="result-screen" id="resultScreen">
      <div class="result-emoji" id="rEmoji">🎉</div>
      <div class="result-title" id="rTitle">太棒了！</div>
      <div class="result-sub"   id="rSub"></div>
      <div class="result-stats">
        <div class="rs"><div class="rs-num" id="rCorrect">0</div><div class="rs-label">答对</div></div>
        <div class="rs"><div class="rs-num" id="rWrong">0</div><div class="rs-label">答错</div></div>
        <div class="rs"><div class="rs-num" id="rAcc">0%</div><div class="rs-label">正确率</div></div>
      </div>
      <button class="restart-btn" onclick="restart()">再来一次 🔄</button>
    </div>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<script>
const TOTAL = 10;
let mode = 'add';   // add | sub | mix
let current = {};
let answer = '';
let correct = 0, wrong = 0, qNum = 1;
let locked = false;

function setMode(m) {
  mode = m;
  ['add','sub','mix'].forEach(k => {
    document.getElementById('mode' + k.charAt(0).toUpperCase() + k.slice(1))
      .classList.toggle('active', k === m);
  });
  restart();
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generate() {
  let op;
  if      (mode === 'add') op = '+';
  else if (mode === 'sub') op = '-';
  else                     op = Math.random() < 0.5 ? '+' : '-';

  let a, b, ans;
  if (op === '+') {
    a = randInt(1, 19);
    b = randInt(1, 20 - a);
    ans = a + b;
  } else {
    a = randInt(2, 20);
    b = randInt(1, a - 1);
    ans = a - b;
  }
  return { a, b, op, ans };
}

function nextQuestion() {
  current = generate();
  answer = '';
  locked = false;

  document.getElementById('num1').textContent = current.a;
  document.getElementById('operator').textContent = current.op;
  document.getElementById('num2').textContent = current.b;

  const disp = document.getElementById('answerDisplay');
  disp.innerHTML = '&nbsp;&nbsp;';
  disp.className = 'answer-display';

  document.getElementById('hint').textContent = '';
  document.getElementById('hint').style.color = '';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('questionIndex').textContent = qNum;
  document.getElementById('progressFill').style.width = ((qNum - 1) / TOTAL * 100) + '%';
}

function pressKey(d) {
  if (locked) return;
  if (answer.length >= 2) return;
  answer += d;
  const disp = document.getElementById('answerDisplay');
  disp.textContent = answer;
  disp.className = 'answer-display';
  document.getElementById('submitBtn').disabled = false;
}

function pressDelete() {
  if (locked) return;
  answer = answer.slice(0, -1);
  const disp = document.getElementById('answerDisplay');
  disp.innerHTML = answer || '&nbsp;&nbsp;';
  disp.className = 'answer-display';
  document.getElementById('submitBtn').disabled = answer === '';
}

function showFeedback(emoji) {
  const el = document.getElementById('feedback');
  el.textContent = emoji;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function submit() {
  if (locked || answer === '') return;
  locked = true;

  const userAns = parseInt(answer);
  const ok = userAns === current.ans;

  const disp = document.getElementById('answerDisplay');
  const hint = document.getElementById('hint');
  const qEl  = document.getElementById('question');

  if (ok) {
    correct++;
    disp.className = 'answer-display correct';
    hint.textContent = '✓ 回答正确！';
    hint.style.color = '#11998e';
    document.getElementById('correctCount').textContent = correct;
    showFeedback('⭐');
  } else {
    wrong++;
    disp.className = 'answer-display wrong';
    hint.textContent = `✗ 正确答案是 ${current.ans}`;
    hint.style.color = '#e55';
    document.getElementById('wrongCount').textContent = wrong;
    qEl.classList.add('shake');
    qEl.addEventListener('animationend', () => qEl.classList.remove('shake'), { once: true });
    showFeedback('💪');
  }

  document.getElementById('submitBtn').disabled = true;

  setTimeout(() => {
    qNum++;
    if (qNum > TOTAL) showResult();
    else nextQuestion();
  }, 900);
}

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('visible');

  const acc = Math.round(correct / TOTAL * 100);
  document.getElementById('rCorrect').textContent = correct;
  document.getElementById('rWrong').textContent = wrong;
  document.getElementById('rAcc').textContent = acc + '%';

  let emoji, title, sub;
  if (correct === TOTAL) {
    emoji = '🏆'; title = '完美满分！';
    sub = `全部 ${TOTAL} 题全部答对！\n你真的太厉害了！🎉`;
  } else if (correct >= 8) {
    emoji = '🌟'; title = '非常棒！';
    sub = `答对 ${correct} 题，做得很好！\n再练几次就能满分！`;
  } else if (correct >= 6) {
    emoji = '😊'; title = '不错哦！';
    sub = `答对 ${correct} 题，继续努力！\n你会越来越厉害的！`;
  } else {
    emoji = '💪'; title = '加油！';
    sub = `答对 ${correct} 题，多多练习\n下次一定会更好！`;
  }

  document.getElementById('rEmoji').textContent = emoji;
  document.getElementById('rTitle').textContent = title;
  document.getElementById('rSub').textContent = sub;
}

function restart() {
  correct = 0; wrong = 0; qNum = 1; locked = false;
  document.getElementById('correctCount').textContent = 0;
  document.getElementById('wrongCount').textContent = 0;
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('visible');
  nextQuestion();
}

// 键盘支持
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') pressKey(e.key);
  else if (e.key === 'Backspace') pressDelete();
  else if (e.key === 'Enter') submit();
});

nextQuestion();
</script>
</body>
</html>
