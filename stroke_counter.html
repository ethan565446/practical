<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>汉字笔画查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #f7f4ef;
    font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    color: #2c2c2c;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #1a1a1a;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: #999;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  .main { width: 100%; max-width: 660px; }

  /* 输入区 */
  .input-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    margin-bottom: 24px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  textarea {
    width: 100%;
    height: 110px;
    border: 1.5px solid #e0ddd8;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 22px;
    font-family: inherit;
    color: #2c2c2c;
    resize: none;
    outline: none;
    background: #fdfcfa;
    line-height: 1.6;
    transition: border-color 0.2s;
    letter-spacing: 4px;
  }

  textarea:focus { border-color: #b06a3a; }
  textarea::placeholder { font-size: 15px; color: #bbb; letter-spacing: 1px; }

  .char-count {
    position: absolute;
    bottom: 10px; right: 14px;
    font-size: 11px;
    color: #ccc;
  }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 1px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary { background: #b06a3a; color: #fff; }
  .btn-primary:hover { opacity: 0.88; }

  .btn-clear { background: #f0ede8; color: #888; }
  .btn-clear:hover { background: #e8e4de; }

  /* 总计 */
  .summary {
    display: none;
    background: #fff;
    border-radius: 16px;
    padding: 22px 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    margin-bottom: 20px;
    display: none;
    align-items: center;
    justify-content: space-around;
    gap: 16px;
  }

  .summary.visible { display: flex; }

  .sum-item { text-align: center; }
  .sum-num {
    font-size: 38px;
    font-weight: 700;
    color: #b06a3a;
    line-height: 1;
  }
  .sum-label { font-size: 12px; color: #aaa; margin-top: 5px; letter-spacing: 1px; }

  .divider { width: 1px; height: 50px; background: #ece9e3; }

  /* 结果列表 */
  #results { display: none; }
  #results.visible { display: block; }

  .result-card {
    background: #fff;
    border-radius: 16px;
    padding: 22px 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  }

  .result-title {
    font-size: 12px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  .char-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .char-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fdfcfa;
    border: 1.5px solid #ece9e3;
    border-radius: 12px;
    padding: 12px 10px 10px;
    min-width: 68px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }

  .char-item:hover {
    border-color: #b06a3a;
    box-shadow: 0 2px 10px rgba(176,106,58,0.15);
  }

  .char-item.unknown {
    border-style: dashed;
    opacity: 0.55;
  }

  .ci-char {
    font-size: 28px;
    line-height: 1;
    margin-bottom: 6px;
    font-family: 'PingFang SC', 'Microsoft YaHei', serif;
  }

  .ci-stroke {
    font-size: 20px;
    font-weight: 700;
    color: #b06a3a;
    line-height: 1;
  }

  .ci-label {
    font-size: 10px;
    color: #bbb;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  /* 详情弹窗 */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    max-width: 340px;
    width: 90%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    animation: popIn 0.2s ease;
  }

  @keyframes popIn {
    from { opacity:0; transform: scale(0.88); }
    to   { opacity:1; transform: scale(1); }
  }

  .modal-char {
    font-size: 80px;
    text-align: center;
    line-height: 1;
    margin-bottom: 12px;
    font-family: 'PingFang SC', 'Microsoft YaHei', serif;
  }

  .modal-stroke {
    text-align: center;
    font-size: 40px;
    font-weight: 700;
    color: #b06a3a;
    margin-bottom: 4px;
  }

  .modal-unit {
    text-align: center;
    font-size: 14px;
    color: #999;
    margin-bottom: 20px;
  }

  .modal-info { font-size: 13px; color: #777; line-height: 2; }
  .modal-info span { color: #333; font-weight: 600; }

  .modal-close {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #f0ede8;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    color: #888;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .modal-close:hover { background: #e8e4de; }

  /* 范例 */
  .examples {
    margin-top: 12px;
    font-size: 12px;
    color: #bbb;
    text-align: center;
  }
  .ex-chip {
    display: inline-block;
    background: #f0ede8;
    border-radius: 6px;
    padding: 3px 10px;
    margin: 3px;
    cursor: pointer;
    color: #888;
    transition: background 0.15s;
  }
  .ex-chip:hover { background: #e0d8cf; color: #555; }

  .tip { font-size: 11px; color: #ccc; margin-top: 8px; text-align: right; }
</style>
</head>
<body>

<h1>汉字笔画</h1>
<p class="subtitle">输入汉字，自动统计每字笔画数</p>

<div class="main">
  <div class="input-card">
    <div class="input-wrap">
      <textarea id="input" placeholder="在此输入汉字，支持多字、词语、句子…" maxlength="50"></textarea>
      <span class="char-count" id="charCount">0 / 50</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="analyze()">查询笔画</button>
      <button class="btn btn-clear" onclick="clearAll()">清空</button>
    </div>
    <div class="examples">
      示例：
      <span class="ex-chip" onclick="fillExample('永')">永</span>
      <span class="ex-chip" onclick="fillExample('中华人民共和国')">中华人民共和国</span>
      <span class="ex-chip" onclick="fillExample('天地玄黄宇宙洪荒')">天地玄黄宇宙洪荒</span>
      <span class="ex-chip" onclick="fillExample('龙凤呈祥')">龙凤呈祥</span>
      <span class="ex-chip" onclick="fillExample('爱')">爱</span>
    </div>
  </div>

  <div class="summary" id="summary">
    <div class="sum-item">
      <div class="sum-num" id="sumChars">0</div>
      <div class="sum-label">汉字数</div>
    </div>
    <div class="divider"></div>
    <div class="sum-item">
      <div class="sum-num" id="sumTotal">0</div>
      <div class="sum-label">总笔画</div>
    </div>
    <div class="divider"></div>
    <div class="sum-item">
      <div class="sum-num" id="sumAvg">0</div>
      <div class="sum-label">平均笔画</div>
    </div>
    <div class="divider"></div>
    <div class="sum-item">
      <div class="sum-num" id="sumMax">—</div>
      <div class="sum-label">最多笔画字</div>
    </div>
  </div>

  <div id="results">
    <div class="result-card">
      <div class="result-title">逐字详情 · 点击查看</div>
      <div class="char-grid" id="charGrid"></div>
      <p class="tip">? 表示笔画数据暂缺</p>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-char" id="mChar"></div>
    <div class="modal-stroke" id="mStroke"></div>
    <div class="modal-unit">画</div>
    <div class="modal-info" id="mInfo"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

// 通过 Unicode Unihan 推断区间兜底
function lookupStrokes(char) {
  const cp = char.codePointAt(0);
  if (STROKE_MAP[cp]) return STROKE_MAP[cp];

  // 使用 Unicode 属性推断（仅作兜底，不精确）
  // 基本CJK统一汉字区间：0x4E00–0x9FFF
  if (cp >= 0x4E00 && cp <= 0x9FFF) return null; // 有字但无数据
  return undefined; // 非汉字
}

function isChinese(char) {
  const cp = char.codePointAt(0);
  return (cp >= 0x4E00 && cp <= 0x9FFF) ||
         (cp >= 0x3400 && cp <= 0x4DBF) ||
         (cp >= 0x20000 && cp <= 0x2A6DF) ||
         (cp >= 0x2A700 && cp <= 0x2B73F) ||
         (cp >= 0xF900 && cp <= 0xFAFF);
}

// ─── 界面逻辑 ────────────────────────────────────────────
const textarea = document.getElementById('input');
textarea.addEventListener('input', () => {
  document.getElementById('charCount').textContent =
    textarea.value.length + ' / 50';
});

function fillExample(text) {
  textarea.value = text;
  document.getElementById('charCount').textContent = text.length + ' / 50';
  analyze();
}

function clearAll() {
  textarea.value = '';
  document.getElementById('charCount').textContent = '0 / 50';
  document.getElementById('summary').classList.remove('visible');
  document.getElementById('results').classList.remove('visible');
  document.getElementById('results').style.display = 'none';
}

function analyze() {
  const text = textarea.value.trim();
  if (!text) { alert('请先输入汉字'); return; }

  const chars = [...text].filter(c => isChinese(c));
  if (chars.length === 0) { alert('未检测到汉字，请输入中文'); return; }

  const items = chars.map(c => ({
    char: c,
    strokes: lookupStrokes(c),
  }));

  const known = items.filter(i => i.strokes !== null && i.strokes !== undefined);
  const totalStrokes = known.reduce((s, i) => s + i.strokes, 0);
  const avgStrokes = known.length ? (totalStrokes / known.length).toFixed(1) : '--';
  const maxItem = known.reduce((a, b) => (b.strokes > a.strokes ? b : a), known[0] || { char: '—', strokes: 0 });

  // 更新总览
  document.getElementById('sumChars').textContent = chars.length;
  document.getElementById('sumTotal').textContent = totalStrokes;
  document.getElementById('sumAvg').textContent = avgStrokes;
  document.getElementById('sumMax').textContent = maxItem ? maxItem.char : '—';
  document.getElementById('summary').classList.add('visible');

  // 生成格子
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'char-item' + (item.strokes == null ? ' unknown' : '');
    div.innerHTML = `
      <div class="ci-char">${item.char}</div>
      <div class="ci-stroke">${item.strokes ?? '?'}</div>
      <div class="ci-label">画</div>
    `;
    div.onclick = () => showModal(item);
    grid.appendChild(div);
  });

  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  resultsEl.classList.add('visible');
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ─── 弹窗 ────────────────────────────────────────────────
const RADICAL_HINTS = {
  '水': '氵','火': '灬','木': '木','金': '钅','土': '土','口': '口',
  '人': '亻','心': '忄','手': '扌','目': '目','日': '日','月': '月',
};

function strokeRank(n) {
  if (!n) return '—';
  if (n <= 3) return '极简单';
  if (n <= 6) return '简单';
  if (n <= 10) return '中等';
  if (n <= 15) return '较复杂';
  return '复杂';
}

function showModal(item) {
  document.getElementById('mChar').textContent = item.char;
  document.getElementById('mStroke').textContent = item.strokes ?? '?';
  document.getElementById('mInfo').innerHTML = `
    <div>Unicode：<span>U+${item.char.codePointAt(0).toString(16).toUpperCase()}</span></div>
    <div>复杂度：<span>${strokeRank(item.strokes)}</span></div>
    <div>拼音区间：<span>${getPinyinHint(item.char)}</span></div>
    ${item.strokes == null ? '<div style="color:#e07070;font-size:12px;margin-top:4px">⚠ 笔画数据暂缺</div>' : ''}
  `;
  document.getElementById('modalBg').classList.add('open');
}

function getPinyinHint(char) {
  const cp = char.codePointAt(0);
  if (cp >= 0x4E00 && cp <= 0x56F0) return '一画至部分七画字区';
  if (cp >= 0x56F1 && cp <= 0x62FF) return '部分六画至十画字区';
  if (cp >= 0x6300 && cp <= 0x77FF) return '部分九画至十四画字区';
  if (cp >= 0x7800 && cp <= 0x8FFF) return '部分十画至十五画字区';
  if (cp >= 0x9000 && cp <= 0x9FFF) return '部分十二画以上字区';
  return 'CJK 扩充区';
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalBg')) {
    document.getElementById('modalBg').classList.remove('open');
  }
}
