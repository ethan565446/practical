<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星座查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #08091a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  /* 星空背景 */
  #stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }

  .page { position: relative; z-index: 1; width: 100%; max-width: 560px; }

  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 4px;
    color: #c8d8ff;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #4a5878;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }

  /* 输入卡片 */
  .input-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 28px;
    backdrop-filter: blur(8px);
  }

  .input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    color: #6a7fa0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input[type=number], input[type=date], select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 16px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    border-color: rgba(140,160,255,0.5);
    background: rgba(255,255,255,0.09);
  }

  input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }

  /* 月日选择行 */
  .date-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  select option { background: #1a2035; }

  .query-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4a6fff, #8a5fff);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .query-btn:hover { opacity: 0.9; }
  .query-btn:active { transform: scale(0.98); }

  /* 结果卡片 */
  #result { display: none; }

  .result-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(8px);
    animation: fadeUp 0.4s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .zodiac-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  .zodiac-glyph {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 0 20px var(--color));
  }

  .zodiac-name-cn {
    font-size: 32px;
    font-weight: 700;
    color: var(--color);
  }

  .zodiac-name-en {
    font-size: 14px;
    color: #6a7fa0;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  .zodiac-date-range {
    font-size: 12px;
    color: #4a5878;
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  .person-info {
    font-size: 13px;
    color: #7a90b0;
    margin-top: 4px;
  }

  /* 属性标签 */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }

  .tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #c0d0f0;
  }

  .tag.element {
    background: color-mix(in srgb, var(--color) 20%, transparent);
    border-color: color-mix(in srgb, var(--color) 40%, transparent);
    color: var(--color);
  }

  /* 特质列表 */
  .traits-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }

  .trait-item {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #b0c0e0;
    border-left: 3px solid var(--color);
  }

  .trait-item .ti-label {
    font-size: 10px;
    color: #4a5878;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
  }

  /* 运势条 */
  .fortune-section { margin-bottom: 22px; }
  .fortune-title {
    font-size: 12px;
    color: #6a7fa0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .fortune-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .fortune-label { width: 50px; color: #8090b0; flex-shrink: 0; }

  .bar-bg {
    flex: 1; height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--color), color-mix(in srgb, var(--color) 60%, #fff));
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .bar-val { width: 28px; text-align: right; font-size: 12px; color: var(--color); }

  /* 今日运势 */
  .daily-fortune {
    background: color-mix(in srgb, var(--color) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--color) 25%, transparent);
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.9;
    color: #c0d0f0;
  }

  .daily-fortune-title {
    font-size: 11px;
    color: var(--color);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* 相配星座 */
  .compat-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .compat-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    color: #c0d0f0;
  }
</style>

// ─── 月份天数 ────────────────────────────────────────────
const MONTH_DAYS = [31,29,31,30,31,30,31,31,30,31,30,31];

document.getElementById('monthSelect').addEventListener('change', function() {
  const m = parseInt(this.value);
  const daySelect = document.getElementById('daySelect');
  daySelect.innerHTML = '<option value="">选择日期</option>';
  if (!m) return;
  for (let d = 1; d <= MONTH_DAYS[m-1]; d++) {
    daySelect.innerHTML += `<option value="${d}">${d}日</option>`;
  }
});

// ─── 查询逻辑 ────────────────────────────────────────────
function getZodiac(month, day) {
  for (const z of ZODIACS) {
    const [sm, sd] = z.start;
    const [em, ed] = z.end;
    if (sm > em) {
      // 跨年 (摩羯)
      if ((month === sm && day >= sd) || (month === em && day <= ed)) return z;
    } else {
      if ((month === sm && day >= sd) || (month === em && day <= ed)) return z;
      if (month > sm && month < em) return z;
    }
  }
  return null;
}

// 伪随机运势值（根据星座+当天日期）
function fortuneVal(seed, key) {
  const today = new Date();
  const base = (seed * 31 + today.getDate() * 7 + today.getMonth() * 13 + key * 17) % 100;
  return Math.max(40, Math.min(95, 60 + (base % 36) - 18));
}

    alert('请选择出生月份和日期');
    return;

          <div class="bar-bg"><div class="bar-fill" style="width:0%" data-w="${career}"></div></div>
          <span class="bar-val">${career}</span>
        </div>
        <div class="fortune-row">
          <span class="fortune-label">爱情</span>
          <div class="bar-bg"><div class="bar-fill" style="width:0%" data-w="${love}"></div></div>
          <span class="bar-val">${love}</span>
        </div>
        <div class="fortune-row">
          <span class="fortune-label">财运</span>
          <div class="bar-bg"><div class="bar-fill" style="width:0%" data-w="${money}"></div></div>
          <span class="bar-val">${money}</span>
        </div>
        <div class="fortune-row">
          <span class="fortune-label">健康</span>
          <div class="bar-bg"><div class="bar-fill" style="width:0%" data-w="${health}"></div></div>
          <span class="bar-val">${health}</span>
        </div>
      </div>

      <div class="daily-fortune">
        <div class="daily-fortune-title">✦ 今日寄语</div>
        ${z.fortune}
      </div>
    </div>
  `;

  // 动画播放运势条
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });

  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Enter 键触发查询
document.addEventListener('keydown', e => { if (e.key === 'Enter') query(); });

// ─── 星空画布 ────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 180 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.2,
      a: Math.random() * 0.7 + 0.15,
      speed: Math.random() * 0.3 + 0.05,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const alpha = s.a * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
